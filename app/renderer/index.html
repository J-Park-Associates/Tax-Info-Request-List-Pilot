<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Nothing but this app's own files may run or be loaded: no inline
       script, no remote resource. The page is built from API data with
       DOM nodes, never from HTML strings. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'" />
  <title></title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pilot-ui.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="pilot-style.css" />
</head>
<body>
  <!-- ═══════════════ The shell (SPEC-shell 3.1) ═══════════════
       The side panel, the path row, the notice area and the page. Every word
       is the API's: shell.js fills each name and tooltip from the
       vocabulary, and this file types none. The page is drawn by shell.js
       (the setup page) and pages.js (the rest). -->
  <div id="shell">
    <nav id="side">
      <div id="side-brand"><img src="logo.svg" alt="" /></div>
      <ul id="side-sections">
        <li><button type="button" class="side-section" data-section="overview"><span class="side-name"></span><span class="side-count"></span></button></li>
        <li><button type="button" class="side-section" data-section="needs-review"><span class="side-name"></span><span class="side-count"></span></button></li>
        <li><button type="button" class="side-section" data-section="reminders"><span class="side-name"></span><span class="side-count"></span></button></li>
        <li><button type="button" class="side-section" data-section="clients"><span class="side-name"></span><span class="side-count"></span></button></li>
      </ul>
      <div id="side-foot">
        <div id="last-sort" role="status" aria-live="polite"></div>
      </div>
    </nav>
    <div id="main">
      <header id="bar">
        <nav id="crumbs"><ol id="crumb-list"></ol></nav>
        <div id="find-wrap">
          <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
          <input id="find" type="text" role="combobox" data-tip-key="screen.find"
                 aria-expanded="false" aria-controls="find-list" aria-autocomplete="list"
                 autocomplete="off" spellcheck="false" />
          <ul id="find-list" role="listbox" hidden></ul>
        </div>
        <button id="sort" class="icon-button" type="button" data-tip-key="screen.sort.now">
          <svg class="icon" aria-hidden="true"><use href="#i-sort" /></svg>
        </button>
      </header>
      <!-- Failures and warnings stay until a person dismisses them (decision 193). -->
      <div id="notices" role="alert" aria-live="polite"></div>
      <!-- The notices' buttons: static, because a notice must work before any
           vocabulary has arrived. Word for word tracker.api.NOTICE_LABELS. -->
      <template id="notice-buttons">
        <button class="btn btn-small notice-act" data-act="retry">Retry</button>
        <button class="icon-button notice-act" type="button" data-act="dismiss" data-tip-key="screen.icons.dismiss" aria-label="Dismiss">
          <svg class="icon" aria-hidden="true"><use href="#i-dismiss" /></svg>
        </button>
      </template>
      <main id="page" tabindex="-1"></main>
    </div>
  </div>

  <!-- The side sheet (SPEC-shell 7): sheet.js draws Check a file and Draft
       reminder into it. Hidden until one opens. -->
  <div id="sheet-scrim" hidden></div>
  <aside id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div id="sheet-head">
      <h2 id="sheet-title" tabindex="-1"></h2>
      <button id="sheet-close" class="icon-button" type="button" data-tip-key="screen.icons.dismiss">
        <svg class="icon" aria-hidden="true"><use href="#i-dismiss" /></svg>
      </button>
    </div>
    <div id="sheet-body"></div>
    <div id="sheet-foot"></div>
  </aside>

  <!-- One tooltip element, reused (SPEC-shell 8.5). -->
  <div id="tip" role="tooltip" hidden></div>

  <!-- The drawn icons (SPEC-shell 3.8): 16px on a 16 viewBox, 1.5px stroke,
       round caps, currentColor. -->
  <svg width="0" height="0" class="visually-hidden" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5L14 14" /></symbol>
    <symbol id="i-sort" viewBox="0 0 16 16"><path d="M13.2 6.2A5.5 5.5 0 0 0 3.4 4.4" /><path d="M3 2v3h3" /><path d="M2.8 9.8a5.5 5.5 0 0 0 9.8 1.8" /><path d="M13 14v-3h-3" /></symbol>
    <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5" /></symbol>
    <symbol id="i-dismiss" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></symbol>
    <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5" /></symbol>
    <symbol id="i-next" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4" /></symbol>
    <symbol id="i-done" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" /></symbol>
    <symbol id="i-more" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="0.6" /><circle cx="8" cy="8" r="0.6" /><circle cx="12.5" cy="8" r="0.6" /></symbol>
    <symbol id="i-open" viewBox="0 0 16 16"><path d="M9 3h4v4M13 3L7.5 8.5M11 9.5V13H3V5h3.5" /></symbol>
  </svg>

  <!-- What is left of the old screen, hidden and never drawn. The pages
       (pages.js) took over the top bar, the banners, the request table, the
       household card and the setup card; what remains here is what the side
       sheet (S5) and the dialogs take over next: the reminder, moved, review
       and filed cards, the standing-rules footer, the roll fold, and the
       three boxes the setup page fills and saveRoot() reads. S5 deletes
       each as it takes it over. -->
  <div id="legacy" class="hidden">
    <input id="root-input" type="text" />
    <input id="firm-input" type="text" />
    <input id="phone-input" type="text" />
    <!-- The household rolls as a household (decisions 126 and 196): drawn only
         when the API names the year it rolls to. Every word is the API's. -->
    <details id="household-roll" class="household-roll ed-paste hidden"></details>

      <!-- The week's reminder (decision 118): what the record says about it,
           the four stages as a toggle, the letter as it will read, and the
           three things a person does with it — copy it, approve it, or open
           the file. Nothing sends: there is no send button here and no mail
           link anywhere in the app. Every word and every colour is the API's
           (vocab.reminder); the page types neither, and the preview is built
           from the letter's own shape with DOM nodes, never from markup. -->
      <section id="reminder-card" class="card hidden">
        <div class="card-head">
          <h3 id="reminder-heading"></h3>
          <span class="summary"></span>
        </div>
        <div class="reminder-body">
          <p id="reminder-status" class="rem-status"></p>
          <!-- One shape per state: held is the hold line, the rows and the
               toggle, and nothing that reads like something to send. -->
          <div id="reminder-hold" class="hidden">
            <p id="reminder-held" class="rem-hold" role="status"></p>
            <ul id="reminder-held-rows" class="rem-hold-rows"></ul>
          </div>
          <div id="reminder-stages" class="rem-stages" role="group"></div>
          <p id="reminder-hint" class="rem-hint"></p>
          <p id="reminder-edited" class="rem-edited hidden"></p>
          <p id="reminder-link-dropped" class="rem-edited hidden" role="status"></p>
          <p id="reminder-subject" class="rem-subject"></p>
          <div id="reminder-preview" class="rem-preview" tabindex="0"></div>
          <div id="reminder-actions" class="rem-actions">
            <button type="button" id="btn-copy" class="btn btn-primary"></button>
            <button type="button" id="btn-approve" class="btn"></button>
            <span class="toolbar-spacer"></span>
            <button type="button" id="btn-open-draft" class="rem-quiet"></button>
          </div>
        </div>
      </section>

      <!-- The copies that wandered (decision 110): above the review queue, because a
           working copy that is not where the record put it is the first
           question of the morning. Every word of it is the API's. -->
      <section id="moved-card" class="card hidden">
        <div class="card-head">
          <h3 id="moved-heading"></h3>
          <span class="summary" id="moved-summary"></span>
        </div>
        <ul id="moved-list" class="review"></ul>
      </section>

      <section id="review-card" class="card hidden">
        <div class="card-head">
          <h3>Needs review</h3>
          <span class="summary">the client sent these; pick the request each belongs to — nothing is guessed</span>
        </div>
        <ul id="review-list" class="review"></ul>
        <details id="dismissed-card" class="dismissed hidden">
          <summary id="dismissed-heading"></summary>
          <ul id="dismissed-list" class="review"></ul>
        </details>
      </section>

      <section id="filed-card" class="card hidden">
        <details class="dismissed">
          <summary id="filed-heading"></summary>
          <ul id="filed-list" class="review"></ul>
        </details>
      </section>

      <footer id="assurances" class="assurances">
        <div class="assure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <div><strong></strong><span></span></div>
        </div>
        <div class="assure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <div><strong></strong><span></span></div>
        </div>
        <div class="assure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <div><strong></strong><span></span></div>
        </div>
        <div class="assure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <div><strong></strong><span></span></div>
        </div>
  </div>


  <!-- The household's own three fields (decision 125): the members a
       person typed as who its folder is meant to be shared with, the
       contact its letters greet and the link they paste. Every label is
       the API's; a save is one recorded event. -->
  <div id="household-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="hh-edit-title">
      <h3 id="hh-edit-title"></h3>
      <label class="field">
        <span id="hh-edit-members-label"></span>
        <textarea id="hh-edit-members" rows="3"></textarea>
      </label>
      <label class="field">
        <span id="hh-edit-contact-label"></span>
        <input id="hh-edit-contact" type="text" />
      </label>
      <label class="field">
        <span id="hh-edit-link-label"></span>
        <input id="hh-edit-link" type="text" />
      </label>
      <!-- The return lines in other households this drop folder also
           feeds (decision 129). Picked from the returns that already
           exist - nothing is typed and nothing is inferred - and every
           one added is warned about what its sharing will show. -->
      <div class="field">
        <span id="hh-edit-feeds-label"></span>
        <ul id="hh-edit-feeds" class="household-feeds"></ul>
        <div class="feed-add">
          <select id="hh-edit-feed-pick"></select>
          <button type="button" id="hh-edit-feed-add" class="btn btn-small"></button>
        </div>
        <p id="hh-edit-feeds-help" class="wiz-note"></p>
        <p id="hh-edit-feed-warning" class="rem-hold hidden" role="status"></p>
      </div>
      <p id="hh-edit-note" class="wiz-note"></p>
      <div class="modal-actions">
        <button id="hh-edit-cancel" class="btn">Cancel</button>
        <span class="toolbar-spacer"></span>
        <button id="hh-edit-save" class="btn btn-primary">Save</button>
      </div>
      <!-- Closing with changes not saved asks first (decision 201): the
           API's sentence and its two answers, the first focused. -->
      <div class="dlg-unsaved banner warn hidden" role="alert">
        <span class="dlg-unsaved-text"></span>
        <span class="toolbar-spacer"></span>
        <button type="button" class="btn btn-small dlg-keep"></button>
        <button type="button" class="btn btn-small dlg-discard"></button>
      </div>
    </div>
  </div>

  <!-- Filing a parked document under a request of another return this
       drop folder feeds (decision 129). The returns offered are the feed
       list's and nothing else; the requests are read from that return's
       own state. Every word is the API's. -->
  <div id="handover-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ho-title">
      <h3 id="ho-title"></h3>
      <p id="ho-name" class="wiz-note"></p>
      <label class="field">
        <span id="ho-return-label"></span>
        <select id="ho-return"></select>
      </label>
      <label class="field">
        <span id="ho-request-label"></span>
        <select id="ho-request"></select>
      </label>
      <div class="modal-actions">
        <button id="ho-cancel" class="btn">Cancel</button>
        <span class="toolbar-spacer"></span>
        <button id="ho-file" class="btn btn-primary"></button>
      </div>
    </div>
  </div>

  <!-- The schedule setting (pilot P21): on or off, when the first run is and
       how often it repeats. Read from `settings`, saved by `set-schedule`;
       every word is the API's (vocab.schedule). -->
  <div id="schedule-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sc-title">
      <h3 id="sc-title"></h3>
      <p id="sc-loading" class="wiz-note hidden" role="status"></p>
      <div id="sc-form">
        <fieldset class="sc-choice">
          <legend id="sc-enabled-label"></legend>
          <label class="sc-radio"><input type="radio" name="sc-enabled" id="sc-on" /><span id="sc-on-label"></span></label>
          <label class="sc-radio"><input type="radio" name="sc-enabled" id="sc-off" /><span id="sc-off-label"></span></label>
        </fieldset>
        <label class="field">
          <span id="sc-start-label"></span>
          <input id="sc-start" type="time" />
        </label>
        <label class="field">
          <span id="sc-every-label"></span>
          <select id="sc-every"></select>
        </label>
        <p id="sc-next" class="wiz-note" role="status"></p>
        <p id="sc-note" class="wiz-note"></p>
        <div id="sc-error" class="banner err hidden" role="alert"></div>
      </div>
      <div class="modal-actions">
        <button id="sc-cancel" class="btn"></button>
        <span class="toolbar-spacer"></span>
        <button id="sc-save" class="btn btn-primary"></button>
      </div>
      <!-- Closing with changes not saved asks first (decision 201). -->
      <div class="dlg-unsaved banner warn hidden" role="alert">
        <span class="dlg-unsaved-text"></span>
        <span class="toolbar-spacer"></span>
        <button type="button" class="btn btn-small dlg-keep"></button>
        <button type="button" class="btn btn-small dlg-discard"></button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ Add a return / New household (decision 196) ═══════════════ -->
  <div id="modal" class="modal-overlay hidden">
    <!-- Named by the heading of the step on screen (showStep, decision 201). -->
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="household-title">

      <!-- New household: the four fields of a household the tracker has
           no record of, made with its first return (decisions 125 and
           196). A name that reads as one already in the list is refused by
           the API, pointing at it there (decision 188). Every word is the
           API's (vocab.household). -->
      <div id="wiz-household" class="hidden">
        <h3 id="household-title"></h3>
        <p id="household-new-intro" class="wiz-sub"></p>

        <div class="tmpl-head" id="hh-new-head"></div>
        <div class="roll-grid">
          <label class="field">
            <span id="hh-name-label"></span>
            <input id="hh-name" type="text" />
          </label>
          <label class="field">
            <span id="hh-contact-label"></span>
            <input id="hh-contact" type="text" />
          </label>
        </div>
        <label class="field">
          <span id="hh-members-label"></span>
          <textarea id="hh-members" rows="3"></textarea>
        </label>
        <label class="field">
          <span id="hh-link-label"></span>
          <input id="hh-link" type="text" />
        </label>
        <!-- What adding a return to a household shows, every time
             (decision 129): everyone on the folder sees the return's
             documents. The API's sentence, shown as it stands. -->
        <p id="hh-return-warning" class="rem-hold" role="status"></p>

        <div class="modal-actions">
          <button id="wh-cancel" class="btn">Cancel</button>
          <span class="toolbar-spacer"></span>
          <button id="wh-next" class="btn btn-primary">Continue</button>
        </div>
      </div>

      <!-- The form type: where Add a return opens, and New household's
           second step. The title names the household a return is added to. -->
      <div id="wiz-form" class="hidden">
        <h3 id="form-title"></h3>
        <p id="form-note" class="wiz-sub"></p>
        <div id="form-grid" class="form-grid"></div>
        <div class="modal-actions">
          <span class="toolbar-spacer"></span>
          <button id="wf-cancel" class="btn">Cancel</button>
        </div>
      </div>

      <!-- Step 2: tailored request list for the chosen form -->
      <div id="wiz-items" class="hidden">
        <h3 id="items-title"></h3>
        <div class="form-chosen">
          <span id="chosen-form" class="chosen-badge"></span>
          <button id="wi-back" class="wiz-back"></button>
          <button id="wi-household" class="wiz-back hidden"></button>
        </div>

        <label class="field">
          <span id="ne-name-label"></span>
          <input id="ne-name" type="text" />
        </label>
        <!-- And again on the page that makes the return (decision 129),
             because this is the page a person is on when they make one. -->
        <p id="ne-return-warning" class="rem-hold" role="status"></p>
        <div class="roll-grid three">
          <label class="field">
            <span>Client (greeting name)</span>
            <input id="ne-client" type="text" placeholder="e.g. John Smith" />
          </label>
          <label class="field">
            <span>Tax year</span>
            <input id="ne-year" type="number" />
          </label>
          <label class="field">
            <span>Due date (optional)</span>
            <input id="ne-due" type="date" />
          </label>
        </div>

        <!-- Who the return is for (decision 128). Every label, the kinds,
             the proposals and the two refusals are the API's; the page
             types none of them, and no spelling is ever inferred from a
             document - the app proposes and a person ticks. -->
        <div class="tmpl-head" id="wp-head"></div>
        <p id="wp-help" class="wiz-note"></p>
        <div id="wp-people" class="people-block"></div>
        <div class="editor-actions">
          <button type="button" id="wp-add" class="btn btn-small"></button>
        </div>

        <!-- The tick is the API's ask-the-client word (decision 142): each row goes on
             the return, and only the ticked ones are asked for and chased.
             The heading's last words and the note are the API's. -->
        <div class="tmpl-head" id="tmpl-head-label"></div>
        <p id="tmpl-note" class="wiz-note"></p>
        <div id="tmpl-list" class="tmpl-list"></div>

        <div class="tmpl-head">Add a custom request</div>
        <!-- Drawn by the one row component (requestRows in app.js), which
             the request-list editor shares: the headings are the API's
             column labels, the identifiers are assigned as the rows are
             added. -->
        <div id="cu-rows" class="editor-rows"></div>
        <div class="editor-actions">
          <button id="cu-add" class="btn btn-small"></button>
        </div>

        <!-- A refused create stays here, in the API's words, until a field
             is edited or the dialog is closed (decision 196). -->
        <p id="ne-note" class="rem-hold hidden" role="alert"></p>
        <div class="modal-actions">
          <button id="ne-cancel" class="btn">Cancel</button>
          <button id="ne-create" class="btn btn-primary"></button>
        </div>
      </div>

      <!-- Closing with changes not saved asks first (decision 201): the
           API's sentence and its two answers, the first focused. -->
      <div class="dlg-unsaved banner warn hidden" role="alert">
        <span class="dlg-unsaved-text"></span>
        <span class="toolbar-spacer"></span>
        <button type="button" class="btn btn-small dlg-keep"></button>
        <button type="button" class="btn btn-small dlg-discard"></button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ Request-list editor (decision 104) ═══════════════ -->
  <!-- Every heading, label, hint and button here is filled from the API's
       vocabulary (vocab.editor, vocab.columns); the page types none of them,
       and the rows are built from state.rules by the one row component. -->
  <div id="editor" class="modal-overlay hidden">
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="ed-title">
      <h3 id="ed-title"></h3>
      <fieldset id="ed-engagement" class="ed-engagement">
        <legend id="ed-engagement-title"></legend>
        <div id="ed-fields" class="ed-fields"></div>
        <!-- The same People block Add a return / New household shows
             (decision 128): the return's own list, edited here and
             nowhere else. -->
        <div class="tmpl-head" id="ep-head"></div>
        <p id="ep-help" class="wiz-note"></p>
        <div id="ep-people" class="people-block"></div>
        <div class="editor-actions">
          <button type="button" id="ep-add" class="btn btn-small"></button>
        </div>
      </fieldset>
      <div id="ed-list-title" class="tmpl-head"></div>
      <div id="ed-rows" class="editor-rows"></div>
      <div class="editor-actions">
        <button id="ed-add" class="btn btn-small"></button>
      </div>
      <details class="ed-paste">
        <summary id="ed-paste-title"></summary>
        <p id="ed-paste-hint" class="wiz-note"></p>
        <textarea id="ed-paste" rows="4" aria-label="Rows to paste"></textarea>
        <div class="editor-actions">
          <button id="ed-paste-btn" class="btn btn-small"></button>
        </div>
      </details>
      <!-- The rename (decision 160): its own act, landing at once, that
           gives a request another identifier and moves its documents. -->
      <details class="ed-paste">
        <summary id="ed-rename-title"></summary>
        <p id="ed-rename-hint" class="wiz-note"></p>
        <div class="editor-actions">
          <select id="ed-rename-from"></select>
          <input id="ed-rename-to" type="text">
          <button id="ed-rename-btn" class="btn btn-small"></button>
        </div>
      </details>
      <div id="ed-note" class="banner hidden" role="status"></div>
      <div class="modal-actions">
        <button id="ed-cancel" class="btn"></button>
        <button id="ed-save" class="btn btn-primary"></button>
      </div>
      <!-- Closing with changes not saved asks first (decision 201): the
           API's sentence and its two answers, the first focused. -->
      <div class="dlg-unsaved banner warn hidden" role="alert">
        <span class="dlg-unsaved-text"></span>
        <span class="toolbar-spacer"></span>
        <button type="button" class="btn btn-small dlg-keep"></button>
        <button type="button" class="btn btn-small dlg-discard"></button>
      </div>
    </div>
  </div>
