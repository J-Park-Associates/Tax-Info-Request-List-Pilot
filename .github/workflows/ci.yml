# Runs the test suite and verifies the repository map still matches the tree.
#
# The map check is here because docs/repo-map.md is what agents read instead of
# re-scanning the repo (see CLAUDE.md). Its freshness is guarded by a test, but
# a guard nothing runs is a convention rather than a rule — this is what makes
# it enforced before anything reaches main.
#
# When it runs, and why (decision 207, revising 122). GitHub's minutes are
# paid, and they went on three things that repeated a check already made:
# every push to main ran the Windows pair at twice the Linux price; labelling
# or updating a pull request started a second run beside the first, and two
# runs started at once cancel each other and are billed anyway. Every session
# now runs the whole suite before it pushes — a cloud session on its own
# machine, the tracker lane on the office PC, which is Windows — so CI is one
# final check before a merge:
#
#   * a pull request into main runs when it is opened ready, updated, or
#     marked ready; a draft runs nothing, because both jobs require
#     `draft == false` (a trigger filter cannot see it: `synchronize` fires on
#     drafts too);
#   * there is no run on a push to main: what merges was checked as the
#     pull request it came from;
#   * Linux runs the floor interpreter and the office's;
#   * Windows runs only on a pull request labelled `windows` — anything
#     touching the held engagement lock, the atomic replace, path handling or
#     a Windows-only test. The label goes on while the pull request is still
#     a draft, so the one run it gets when marked ready sees it; `labeled` is
#     not a trigger, because it started a second, paid run.
#
# The steps themselves are not in this file. A job's own `if:` is evaluated
# before a matrix is expanded and cannot see the `matrix` context, so this
# cannot be one matrix with a condition on its Windows rows; it is two jobs,
# and both call .github/workflows/gate.yml so that the gate is written once.
# On a pull request that did not ask for Windows the second job is skipped as
# a whole — never started, never billed, and reported as skipped rather than
# as a check that passed. The timeout lives with the steps, in gate.yml.
#
# The trade-off taken: a Windows-only regression in an unlabelled pull request
# is caught by the office PC's own run before the push, not by GitHub. The
# tag build (build.yml) still builds and tests every release on GitHub.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

# A newer push makes an in-flight run irrelevant; don't pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two interpreters, written out one row at a time rather than crossed: the
  # floor line has to stay readable as one literal, because
  # tests/test_single_source.py pins it to pyproject's requires-python by
  # substring and a flow sequence would hide it.
  #
  # The floor is what the code may use. The other is what the firm's machine
  # runs and what the portable package is frozen on (pyproject.toml's
  # [tool.office], built by .github/workflows/build.yml); a package that ships
  # on an interpreter the suite has never run under is tested for the first
  # time at the office (decision 78). Both are checked here, on Linux: the
  # floor is a language-version check, and Linux is where it is made.
  linux:
    name: Linux
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.14"
    uses: ./.github/workflows/gate.yml
    with:
      os: ubuntu-latest
      python-version: ${{ matrix.python-version }}

  # Windows on a ready pull request that asked, by its label.
  windows:
    name: Windows
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'windows')
    uses: ./.github/workflows/gate.yml
    with:
      os: windows-latest
      # On the office's interpreter only: what Windows has to prove is how the
      # interpreter the office runs behaves there, not that the floor is still
      # the floor.
      python-version: "3.14"
