# Runs the test suite and verifies the repository map still matches the tree.
#
# The map check is here because docs/repo-map.md is what agents read instead of
# re-scanning the repo (see CLAUDE.md). Its freshness is guarded by a test, but
# a guard nothing runs is a convention rather than a rule — this is what makes
# it enforced before anything reaches main.
#
# When it runs, and why (decision 211, revising 207 and 122). GitHub's
# minutes are paid, and Jason's rule (2026-09-26) is that CI never fires per
# commit: every session runs the whole local gate - the suite, ruff, the map
# and vocabulary checks - before it pushes, on its own machine, and CI runs
# only where a person explicitly asks for the safety net:
#
#   * a push to main runs Linux: the net under what just merged;
#   * a pull request into main runs once, when a person marks it ready
#     (`ready_for_review`); main's branch protection needs its two Linux
#     checks before a merge, so without that one run nothing could merge.
#     A push to a ready pull request runs nothing (there is no
#     `synchronize`, and no `opened`); to check it again, set it back to
#     draft and mark it ready. A draft runs nothing, because both jobs
#     require `draft == false`;
#   * Windows runs only on a ready pull request labelled `windows` - on
#     `ready_for_review`, or on `labeled` when the label added is
#     `windows`, which is the person's explicit ask for it - and never on a
#     push to main: the office PC, which is Windows, runs the gate before
#     the push. `labeled` with any other label runs nothing, and Linux
#     never runs on `labeled`;
#   * a pull request based on another branch runs nothing, and retargeting
#     it onto main starts nothing, so a stacked pull request stays a draft
#     until it is retargeted, then is marked ready;
#   * Linux runs the floor interpreter and the office's.
#
# The steps themselves are not in this file. A job's own `if:` is evaluated
# before a matrix is expanded and cannot see the `matrix` context, so this
# cannot be one matrix with a condition on its Windows rows; it is two jobs,
# and both call .github/workflows/gate.yml so that the gate is written once.
# On a pull request that did not ask for Windows the second job is skipped as
# a whole — never started, never billed, and reported as skipped rather than
# as a check that passed - reported only as "Windows", never as the gate's
# own name, so no Windows check may be made a required status check: it would
# wait forever on every unlabelled pull request. The same holds for Linux: a
# Linux job skipped (on a label event) reports only as "Linux", never as the
# required "Linux (3.11) / ..." and "Linux (3.14) / ..." names, so a skipped
# run can never stand in for a real Linux pass. The timeout lives with the
# steps, in gate.yml.
#
# The trade-off taken: main's Windows run, the old safety net, is gone. A
# cloud session tests on Linux, so a Windows-only regression in an
# unlabelled pull request is caught only if the office PC ran the tests it
# touches before the push. That is why the label goes on anything touching
# the lock, the atomic replace, path handling or a Windows-only test (159's
# Windows run found two real bugs Linux hides). The tag build (build.yml)
# smoke-checks the frozen package; it does not run the suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [ready_for_review, labeled]

# A newer run of the same kind makes an in-flight one irrelevant; don't pay
# for both. A label run is its own group (decision 211's review): adding a
# label - any label - to a pull request whose Linux checks are running must
# never cancel them, or the required checks are left cancelled and the merge
# is blocked (the same class of failure that stalled 159's pull request).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'gate' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two interpreters, written out one row at a time rather than crossed: the
  # floor line has to stay readable as one literal, because
  # tests/test_single_source.py pins it to pyproject's requires-python by
  # substring and a flow sequence would hide it.
  #
  # The floor is what the code may use. The other is what the firm's machine
  # runs and what the portable package is frozen on (pyproject.toml's
  # [tool.office], built by .github/workflows/build.yml); a package that ships
  # on an interpreter the suite has never run under is tested for the first
  # time at the office (decision 78). Both are checked here, on Linux: the
  # floor is a language-version check, and Linux is where it is made.
  linux:
    name: Linux
    if: github.event_name == 'push' || (github.event.action == 'ready_for_review' && github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.14"
    uses: ./.github/workflows/gate.yml
    with:
      os: ubuntu-latest
      python-version: ${{ matrix.python-version }}

  # Windows on a ready pull request that asked, by its label: when it is
  # marked ready with the label on, or when the label is added to it.
  windows:
    name: Windows
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'windows') && (github.event.action == 'ready_for_review' || github.event.label.name == 'windows')
    uses: ./.github/workflows/gate.yml
    with:
      os: windows-latest
      # On the office's interpreter only: what Windows has to prove is how the
      # interpreter the office runs behaves there, not that the floor is still
      # the floor.
      python-version: "3.14"
