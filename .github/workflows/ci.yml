# Runs the test suite and verifies the repository map still matches the tree,
# on Linux and on Windows.
#
# The map check is here because docs/repo-map.md is what agents read instead of
# re-scanning the repo (see CLAUDE.md). Its freshness is guarded by a test, but
# a guard nothing runs is a convention rather than a rule — this is what makes
# it enforced on every push and pull request.
#
# Windows is in the matrix because the firm's machine is Windows: the held
# engagement lock, the atomic os.replace over a file Excel may hold, and the
# path handling all behave differently there, and the suite has tests that
# only run on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant; don't pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and repository map (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The floor pyproject.toml declares is what the firm's Windows box runs,
      # so it is the version worth the signal (tests/test_single_source.py pins it).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

      # always(): a stale map and a failing test are separate problems, and
      # seeing both in one run beats finding the second after fixing the first.
      - name: Check the repository map is current
        if: always()
        run: python tools/repo_map.py check

      # The Electron shell has no test suite of its own; at least it must parse.
      - name: Check the Electron shell parses
        if: always()
        run: |
          node --check app/main.js
          node --check app/preload.js
          node --check app/renderer/app.js
