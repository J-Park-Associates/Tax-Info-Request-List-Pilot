# Runs the test suite and verifies the repository map still matches the tree,
# on Linux and on Windows, on the floor interpreter and on the office's.
#
# The map check is here because docs/repo-map.md is what agents read instead of
# re-scanning the repo (see CLAUDE.md). Its freshness is guarded by a test, but
# a guard nothing runs is a convention rather than a rule — this is what makes
# it enforced on every push and pull request.
#
# Windows is in the matrix because the firm's machine is Windows: the held
# engagement lock, the atomic os.replace over a file Excel may hold, and the
# path handling all behave differently there, and the suite has tests that
# only run on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant; don't pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and repository map (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      # Two interpreters on both operating systems, written out one row at a
      # time rather than crossed: the floor line has to stay readable as one
      # literal, because tests/test_single_source.py pins it to pyproject's
      # requires-python by substring and a flow sequence would hide it.
      #
      # The floor is what the code may use. The other is what the firm's
      # machine runs and what the portable package is frozen on
      # (pyproject.toml's [tool.office], built by .github/workflows/build.yml);
      # a package that ships on an interpreter the suite has never run under
      # is tested for the first time at the office (decision 78).
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

      # Dead code and unused imports are the linter's job, not a reviewer's
      # (pyproject.toml says what it checks).
      - name: Lint
        if: always()
        run: python -m ruff check .

      # always(): a stale map and a failing test are separate problems, and
      # seeing both in one run beats finding the second after fixing the first.
      - name: Check the repository map is current
        if: always()
        run: python tools/repo_map.py check

      # The coverage report is what the next review round is briefed from;
      # a stale one sends it after the wrong keywords.
      - name: Check the vocabulary coverage report is current
        if: always()
        run: python tools/vocab_report.py check

      # The Electron shell has no test suite of its own; at least it must parse.
      - name: Check the Electron shell parses
        if: always()
        run: |
          node --check app/main.js
          node --check app/preload.js
          node --check app/renderer/app.js
