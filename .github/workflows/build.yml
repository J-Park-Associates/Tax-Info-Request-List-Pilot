# Builds the portable package the office actually installs, and runs it.
#
# The package is the only thing anybody at the firm ever launches: a PyInstaller
# freeze of api_entry.py beside the Electron shell, carried there on a USB
# stick. It was built by hand, on one machine, and nothing else ever ran it —
# so a package that does not start is discovered at the office, after the drive
# trip. This job runs "Build App.bat" itself, not a re-implementation of it
# (a second copy of the build would be the thing that drifts), and then runs
# the frozen executable it produced, because a package that exists is not the
# same claim as a package that answers.
#
# Not on every commit: a freeze, an npm install, an Electron download and a
# few hundred megabytes of artifact, on a Windows runner, are not what a commit
# should cost. It is made by a release tag and nothing else (decision 191):
# `v*` tags are protected, so only an admin can make one, and a package is
# therefore always the build of reviewed code. There is no manual trigger -
# a run started by hand from any branch would make a package nobody reviewed -
# and the job's own `if:` refuses any ref that is not a `v` tag.
#
# The package is uploaded as one zip beside its SHA-256, and the hash is
# written on the run's summary page. Before a USB stick is written, the
# runbook compares that page's hash with `certutil -hashfile <zip> SHA256`
# on the inner zip - the download is the artifact's own wrapper zip, holding
# this zip and its .sha256 - which proves the zip on the stick is the zip this
# run built (transport), not that the run built reviewed code (the tag does).
name: Build the portable package

on:
  push:
    tags: ["v*"]

# Two builds of one ref would make the same package twice; the second waits
# rather than cancelling the first, because a cancelled build leaves nothing
# to download.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Portable package
    # The package is a Windows package and the firm's machine is Windows;
    # there is no other host this could be built on.
    runs-on: windows-latest
    # Tags only, again at the job: the trigger above is the rule, and this
    # guard keeps it true if a trigger is ever added.
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 90
    steps:
      # git comes with the checkout, and the build reads it: BUILD-INFO.txt
      # records the commit the package was made from.
      #
      # Every action is pinned by the commit of the release named beside it
      # (decision 137, B3): a tag can be moved to other code, a commit
      # cannot. tests/test_build.py holds every workflow to that. The job
      # never pushes, so the token is not left in .git/config (F-12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The interpreter the firm's machine runs, which is therefore the one
      # this package IS: the batch file freezes with whatever `python` is on
      # the machine. pyproject.toml's [tool.office] is the one place that
      # version is written down, and tests/test_build.py pins this line to it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: lts/*

      # Only the scratch clients root below needs these; the packages that go
      # into the package are the virtual environment the batch file makes from
      # the locks, and nothing here touches that.
      # The same two hash-checked steps as the gate and the batch file
      # (decisions 169 and 191), from the same locks the package freezes.
      # The source's own dry pass below needs the reader too.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes --no-deps -r requirements-nodeps.lock

      # Every run of the tracker in this job keeps its data folder under the
      # runner's temp (decision 186), never the runner account's own, so no
      # step's store, log or scratch can follow the package anywhere. A
      # job-level env cannot read the runner context, hence GITHUB_ENV.
      - name: Give the tracker a data folder of this job's own
        run: Add-Content -Path $env:GITHUB_ENV -Value "TRACKER_DATA_HOME=$(Join-Path $env:RUNNER_TEMP 'data-home')"

      # The batch file as a person runs it. The one difference is the switch
      # its own header documents, which skips the waits nobody is here to end.
      - name: Build the portable package
        shell: cmd
        env:
          TRACKER_BUILD_NONINTERACTIVE: "1"
        run: |
          call "Build App.bat"
          if errorlevel 1 exit /b 1

      # Where the package landed is the batch file's fact and the shell's, not
      # this file's: OUT, PLATFORM and ARCH are read back out of the batch file
      # and the two names out of app/package.json, so no path here is a second
      # copy of one. TRACKER_PRODUCT_NAME is what the Electron shell passes the
      # frozen API at run time; the smoke checks below pass the same thing,
      # from the same place, because a frozen build has no package.json to read.
      - name: Find what the build made
        run: |
          $bat = Get-Content "Build App.bat" -Raw
          $out = [regex]::Match($bat, '(?m)^set OUT=(\S+)').Groups[1].Value
          $platform = [regex]::Match($bat, '(?m)^set PLATFORM=(\S+)').Groups[1].Value
          $arch = [regex]::Match($bat, '(?m)^set ARCH=(\S+)').Groups[1].Value
          $info = [regex]::Match($bat, '(?m)^>\s*"%PKG%\\([^"]+)"').Groups[1].Value
          $product = node -p "require('./app/package.json').productName"
          $api = node -p "require('./app/package.json').config.apiName"
          $package = Join-Path $out "dist\$product-$platform-$arch"
          $exe = Join-Path $package "resources\$api\$api.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "no frozen executable at $exe" }
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_DIR=$package"
          Add-Content -Path $env:GITHUB_ENV -Value "API_EXE=$exe"
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_INFO=$(Join-Path $package $info)"
          Add-Content -Path $env:GITHUB_ENV -Value "TRACKER_PRODUCT_NAME=$product"

      # What the package says about itself: the commit, the interpreter, and
      # every package frozen into it. It is the first thing to read when a
      # package misbehaves at the office.
      - name: Say what was built
        run: Get-Content -LiteralPath $env:BUILD_INFO

      # An unconfigured install is the state every package is in when it is
      # first unzipped, and the app's first call is this one. It has to answer
      # in JSON — a traceback here is a blank window at the office.
      - name: The frozen API answers in JSON with no clients root set
        env:
          TRACKER_SETTINGS_DIR: ${{ runner.temp }}\settings
        run: |
          New-Item -ItemType Directory -Force -Path $env:TRACKER_SETTINGS_DIR | Out-Null
          $printed = & $env:API_EXE list | Out-String
          if ($LASTEXITCODE -ne 0) { throw "list exited $LASTEXITCODE with: $printed" }
          $answer = $printed | ConvertFrom-Json
          if ($answer -is [array]) { throw "list printed more than one JSON value: $printed" }
          if (-not $answer.PSObject.Properties.Name) { throw "list printed no JSON object: $printed" }
          Write-Host "list answered with: $($answer.PSObject.Properties.Name -join ', ')"

      # Made-up documents, written from nothing by the suite's own sample
      # builder. Client data never enters this repo, so the thing CI runs the
      # package over cannot be a client's folder. The folder is named once
      # here and handed on, because the runner context a step may read is not
      # one a job's env can.
      - name: Build a scratch clients root
        env:
          SCRATCH_ROOT: ${{ runner.temp }}\clients
        run: |
          python -c "import os; from tests.samples import build_scratch_root; build_scratch_root(os.environ['SCRATCH_ROOT'])"
          Add-Content -Path $env:GITHUB_ENV -Value "SCRATCH_ROOT=$env:SCRATCH_ROOT"

      # The other half of the executable: the scheduled job. --dry-run decides
      # everything and writes nothing, and the root holds enough for the pass
      # to file, route, scan and draft rather than find an empty folder.
      # --reminders always, because otherwise the draft step would only run on
      # the one weekday the runner drafts on and most builds would skip it.
      #
      # And it reads (decision 169): the root holds a scan only the reader can
      # file (tests/samples.py, SCRATCH_SCAN). The package's engagement line
      # must be the source's own - a package missing a model, or the reader,
      # parks the scan and says "review" once more - and its run log's first
      # line must say the processor read, as it does with no graphics card pack.
      # The pass is run the way the scheduled job runs it: its root from a
      # settings folder, with --log. A root on the command line together with
      # --log is refused (decision 131's review, F3), so the scratch root is
      # written into a settings folder of the step's own first.
      - name: The frozen executable makes one dry pass and reads the scan as the source does
        run: |
          $log = Join-Path $env:RUNNER_TEMP "smoke-runs.log"
          $settings = Join-Path $env:RUNNER_TEMP "smoke-settings"
          New-Item -ItemType Directory -Force -Path $settings | Out-Null
          $env:TRACKER_SETTINGS_DIR = $settings
          python -m tracker.settings $env:SCRATCH_ROOT
          if ($LASTEXITCODE -ne 0) { throw "the scratch root could not be set" }
          Remove-Item Env:TRACKER_SETTINGS_DIR
          $frozen = & $env:API_EXE --run --settings $settings --dry-run --reminders always --log $log | Out-String
          if ($LASTEXITCODE -ne 0) { throw "the dry pass exited $LASTEXITCODE" }
          Write-Host $frozen
          $source = python -m tracker.runner $env:SCRATCH_ROOT --dry-run --reminders always | Out-String
          if ($LASTEXITCODE -ne 0) { throw "the source's dry pass exited $LASTEXITCODE" }
          $lines = { param($text) (($text -split "`r?`n") | Where-Object { $_ -match '^\s+(OK|ERROR|SKIP)\s' }) -join "`n" }
          if (-not (& $lines $frozen)) { throw "the package's dry pass printed no OK, ERROR or SKIP line to compare:`n$frozen" }
          if ((& $lines $frozen) -ne (& $lines $source)) {
            throw "the package read the pile differently from the source:`n$frozen`n--- the source ---`n$source"
          }
          $first = Get-Content -LiteralPath $log -TotalCount 1
          if ($first -notmatch 'reader=processor') { throw "the run log's first line names no processor: $first" }

      # Proof that the package carries nothing a pass derives from clients and
      # no settings: every name the data home or the settings folder holds
      # (decision 186) - decision 159's checkpoint, recovered folder and
      # last-pass file, and decision 193's error log (with its rotated
      # copies) and passes folder among them, and the checkpoint's journal,
      # a copy renamed .damaged and 159's set-asides (by their pattern) -
      # checked before the package is zipped.
      - name: The package holds no store, run log, task file or settings
        run: |
          $names = @('tracker.db', 'tracker.db-wal', 'tracker.db-shm', 'runs.log', 'pass-order.json', 'record-heads.db', 'record-heads.db-journal', 'record-heads.db-wal', 'record-heads.db-shm', 'record-heads.db.damaged', 'recovered', 'last-pass.json', 'tracker-errors.log', 'tracker-errors.log.1', 'tracker-errors.log.2', 'tracker-errors.log.3', 'passes', 'tax-tracker.xml', 'ocr-scratch', 'tax-document-tracker-pilot', 'settings.json')
          $patterns = @('tracker.db.v*.old*', 'record-heads.db.v*.old*')
          $found = Get-ChildItem -LiteralPath $env:PACKAGE_DIR -Recurse -Force | Where-Object { $name = $_.Name; ($names -contains $name) -or ($patterns | Where-Object { $name -like $_ }) }
          if ($found) { throw "the package holds what belongs in a data folder or a settings folder: $($found.FullName -join ', ')" }

      # After both smoke checks, so only a package that answered is hashed.
      # One zip, its SHA-256 beside it in the `<hex>  <name>` form, and the
      # hash on the run's summary page - the copy the runbook compares with
      # `certutil -hashfile` before a stick is written, because a hash that
      # travels only inside the download proves nothing about the download.
      - name: Zip the package and publish its SHA-256
        run: |
          $zipName = "tax-document-tracker-$env:GITHUB_REF_NAME.zip"
          $zip = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path $env:PACKAGE_DIR -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          $sum = "$zip.sha256"
          Set-Content -LiteralPath $sum -Value "$hash  $zipName" -Encoding ascii -NoNewline
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "SHA-256 of ``$zipName``: ``$hash``"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_ZIP=$zip"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_SHA256=$sum"

      # Last, so what can be downloaded is a package that answered both ways.
      # Seven days: long enough to fetch it and copy it to the stick, short
      # enough that nobody installs a package from a forgotten run.
      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: portable-package
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_SHA256 }}
          retention-days: 7
