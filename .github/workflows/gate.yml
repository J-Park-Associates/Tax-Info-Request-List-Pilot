# The gate, written once: the suite, the linter, the two freshness checks and
# the Electron parse, on whichever runner and interpreter the caller names.
#
# It lives here rather than in .github/workflows/ci.yml because a job's own
# `if:` is evaluated before a matrix is expanded and cannot see the `matrix`
# context, so "Linux always, Windows only when it is asked for" cannot be one
# matrix with a condition on it. ci.yml is two jobs instead — and two jobs that
# each wrote these steps out would be two copies of the gate, the second one to
# drift. Both call this file, so there is one.
name: Gate

on:
  workflow_call:
    inputs:
      os:
        description: The runner to run the gate on.
        required: true
        type: string
      python-version:
        description: The interpreter to run it under.
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Tests and repository map (${{ inputs.os }}, Python ${{ inputs.python-version }})
    runs-on: ${{ inputs.os }}
    # A ceiling that stops a hung job, not a target. The Windows suite
    # measured 26 to 28 minutes on main on 2026-09-26, and decision 159's
    # tests took it past 30 and then near 45, so a healthy run was cut off
    # and proved nothing. A cut-off run is billed in full anyway, and a run
    # is billed for the minutes it uses, so 60 costs nothing a healthy run
    # would not; a real hang still stops (Jason, 2026-09-26: 60 minutes).
    timeout-minutes: 60
    steps:
      # Every action is pinned by the commit its tag named when it was
      # pinned (decision 137, B3): a tag can be moved to other code, a
      # commit cannot. The release stays beside it, for a person updating it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # The job never pushes, so the token is not left in .git/config for
        # every later step to read (F-12).
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-nodeps.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: lts/*

      # The same locks the package freezes, hash-checked (decision 191): a
      # file replaced at a pinned version, or a package the locks do not
      # name, fails the install. The runner's own pip is used - upgrading it
      # first would be the one unpinned, unhashed install.
      # Two steps (decision 169, R-11): the reader's own package goes in
      # without its dependencies, because its metadata asks for the GUI
      # build of OpenCV; requirements.lock holds what it really needs. On
      # Linux that is the plain onnxruntime (R-11b): CI has no graphics card.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes --no-deps -r requirements-nodeps.lock

      - name: Run the test suite
        run: python -m pytest -q

      # Dead code and unused imports are the linter's job, not a reviewer's
      # (pyproject.toml says what it checks).
      - name: Lint
        if: always()
        run: python -m ruff check .

      # always(): a stale map and a failing test are separate problems, and
      # seeing both in one run beats finding the second after fixing the first.
      - name: Check the repository map is current
        if: always()
        run: python tools/repo_map.py check

      # The coverage report is what the next review round is briefed from;
      # a stale one sends it after the wrong keywords.
      - name: Check the vocabulary coverage report is current
        if: always()
        run: python tools/vocab_report.py check

      # The Electron shell has no test suite of its own; at least it must parse.
      - name: Check the Electron shell parses
        if: always()
        run: |
          node --check app/main.js
          node --check app/preload.js
          node --check app/renderer/app.js
